[project]
name = "eva-speak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harsh", email = "harsh.work211@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1,<2",
    "jiwer>=3,<5",
    "langchain>=0.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=0.2",
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "opencv-contrib-python==4.11.0.86",
    "pandas>=2.2,<4",
    "pinecone>=7.3.0",
    "pinecone-client>=5",
    "pymongo>=4",
    "pypdf>=5",
    "pytest>=8,<10",
    "python-docx>=1",
    "streamlit>=1.58,<2",
    "vadersentiment==3.3.2",
]

[project.scripts]
eva-speak = "eva_speak:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
